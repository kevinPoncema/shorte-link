services:
  postgres:
    image: postgres:16-alpine
    container_name: qr_shortener_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-qr_shortener}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-qr_shortener}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qr_shortener_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr_shortener_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-qr_shortener}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      DB_LOGGING: ${DB_LOGGING:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-jwt-key-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      IP_HASH_SALT: ${IP_HASH_SALT:-change-this-ip-anonymization-salt}
      ANALYTICS_WORKER_ENABLED: ${ANALYTICS_WORKER_ENABLED:-true}
      ANALYTICS_WORKER_INTERVAL_MS: ${ANALYTICS_WORKER_INTERVAL_MS:-15000}
      ANALYTICS_WORKER_BATCH_SIZE: ${ANALYTICS_WORKER_BATCH_SIZE:-200}
      DEV_GEOIP_FALLBACK_COUNTRY: ${DEV_GEOIP_FALLBACK_COUNTRY:-HN}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_51MockStripeSecretKeyForLocalDev1234567890}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_MockStripeWebhookSecret1234567890}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-price_1ProMonthlySubscriptionMock123456}
      ENABLE_PHYSICAL_ORDERS: ${ENABLE_PHYSICAL_ORDERS:-true}
      PRICE_ACRYLIC_STAND: ${PRICE_ACRYLIC_STAND:-15.00}
      PRICE_PLASTIC_CARD: ${PRICE_PLASTIC_CARD:-10.00}
      PRICE_NFC_CARD: ${PRICE_NFC_CARD:-10.00}
      PRICE_NFC_STICKER: ${PRICE_NFC_STICKER:-5.00}
    ports:
      - "${PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: qr_shortener_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
  redis_data:
